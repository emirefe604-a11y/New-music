name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          if [ -f "NewMusic.zip" ]; then
            echo "Found NewMusic.zip, unzipping..."
            unzip -o NewMusic.zip
          fi

      - name: Locate iOS Project
        id: find_project
        run: |
          if [ -d "iosApp/iosApp.xcodeproj" ]; then
            echo "PROJECT_DIR=iosApp" >> $GITHUB_ENV
          elif [ -d "NewMusic/iosApp/iosApp.xcodeproj" ]; then
            echo "PROJECT_DIR=NewMusic/iosApp" >> $GITHUB_ENV
          else
            echo "Searching for iosApp.xcodeproj..."
            FOUND=$(find . -name "iosApp.xcodeproj" | head -n 1)
            if [ -n "$FOUND" ]; then
              echo "PROJECT_DIR=$(dirname "$FOUND")" >> $GITHUB_ENV
            else
              echo "Error: iosApp.xcodeproj not found!"
              exit 1
            fi
          fi

      - name: Build iOS Application (.app)
        run: |
          cd ${{ env.PROJECT_DIR }}
          xcodebuild clean build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package into IPA
        run: |
          cd ${{ env.PROJECT_DIR }}
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          echo "Found app at $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r NewMusic.ipa Payload/
          mv NewMusic.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewMusic-iOS-IPA
          path: NewMusic.ipa
          retention-days: 14
